<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmulatorJS on Google Sites</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; }
        #emulator { flex: 1; }
        #controls { 
            background-color: #222; 
            padding: 15px; 
            color: #fff; 
            border-bottom: 1px solid #444;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        #rom-input { 
            padding: 8px; 
            cursor: pointer; 
        }
        #status { 
            color: #aaa; 
            font-size: 14px; 
            margin-left: auto;
        }
        button {
            padding: 8px 16px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #0052a3;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="controls">
            <label for="rom-input">Load ROM:</label>
            <input type="file" id="rom-input" accept=".nes,.snes,.gb,.gba,.md" />
            <select id="core-select">
                <option value="nes">NES</option>
                <option value="snes">SNES</option>
                <option value="gb">Game Boy</option>
                <option value="gba">Game Boy Advance</option>
                <option value="segaMD">Sega Genesis</option>
            </select>
            <span id="status">Ready</span>
        </div>
        <div id="emulator"></div>
    </div>

    <script>
        let currentEmulator = null;
        
        // EmulatorJS configuration
        const EJS_player = '#emulator';
        const EJS_pathtodata = 'https://emulatorjs.org';
        
        // Handle file selection
        document.getElementById('rom-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            // Read file as data URL
            const reader = new FileReader();
            reader.onload = function(event) {
                const romData = event.target.result;
                
                // Get selected core
                const core = document.getElementById('core-select').value;
                
                // Update status
                document.getElementById('status').textContent = `Loading: ${file.name}`;
                
                // Configure and load emulator
                window.EJS_player = '#emulator';
                window.EJS_core = core;
                window.EJS_pathtodata = 'https://emulatorjs.org';
                window.EJS_gameUrl = romData;
                
                // Reload the emulator with new ROM
                reloadEmulator();
            };
            reader.readAsDataURL(file);
        });
        
        // Handle core selection change
        document.getElementById('core-select').addEventListener('change', function() {
            document.getElementById('status').textContent = 'Core changed - load a ROM';
        });
        
        function reloadEmulator() {
            // Clear existing emulator
            const container = document.getElementById('emulator');
            container.innerHTML = '';
            
            // Reload emulator script
            if (document.getElementById('ejs-loader')) {
                document.getElementById('ejs-loader').remove();
            }
            
            const script = document.createElement('script');
            script.id = 'ejs-loader';
            script.src = 'https://emulatorjs.org/loader.js';
            script.onload = function() {
                document.getElementById('status').textContent = 'Running';
            };
            document.body.appendChild(script);
        }
    </script>

</body>
</html>
